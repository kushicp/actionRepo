apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: appr-without-input-params
on:
  workflow_dispatch:
jobs:
  ask-now:
    with:
      approvers: 0a808e26-f884-11ec-aa0a-42010a83ae55
      disallowLaunchByUser: false
      instructions: Test instructions here
      approvalInputs: |
        {}
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
  print_outputs:
    steps:
      - name: Print manual approval output params
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Output from custom job:"
          echo "comments: ${{ needs.ask-now.outputs.comments }}"
    needs: ask-now
