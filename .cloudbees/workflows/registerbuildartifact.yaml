apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: RegisterBuildArtifact

on:
  workflow_dispatch:
jobs:
  build:
    steps:
      - name: label1, Label with space, aLabel!!
        uses: cloudbees-io/register-build-artifact@CBP-14025
        with:
          name: "kcpBldRegister 0"
          version: "0.0.1"
          url: "docker.io/myapp/kcpBldImg:0.0.1"
          digest: "d1"
          target-environment: "Test_env"
          labels: "label1, Label with space, aLabel!!"
      - name: "['aLabel1  ', 'aLabel2', 'aLabel3']"
        uses: cloudbees-io/register-build-artifact@CBP-14025
