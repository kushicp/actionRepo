          url: "docker.io/myapp/kcpBldImg:2.0.2"
          digest: "d2"
          target-environment: "Test_env"
          labels: "['aLabel1  ', '  aLabel2', '  aLabel3  ']"
      - name: '["aL1","aL2","aL3"]'
