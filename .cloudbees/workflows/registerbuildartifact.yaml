apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: RegisterBuildArtifact
on:
  workflow_dispatch:
jobs:
  buildArtRegTest:
    steps:
      - id: republishArtifact
        name: republish without digest
        with:
          version: "11.11"
          url: docker.io/myapp/kcpImg11:11.11.11
          labels:  "lbl1"
          name: kcpBuildRegister 11
        uses: cloudbees-io/register-build-artifact@v1
      - name: Artifact Id output
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
          echo "Output param: ${{ steps.registerBuildArtifact.outputs.artifact-id }}"
