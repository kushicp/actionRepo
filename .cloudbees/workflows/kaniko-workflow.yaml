apiVersion: automation.cloudbees.io/v1alpha1
kind: release
name: My automation
on:
  workflow_dispatch:
jobs:
  build:
    environment: us-env
    steps:
      - uses: docker://alpine/git:latest
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - uses: cloudbees-io/checkout@v1
        name: checkout
      - uses: docker://golang:1.20
        name: Build Go app
        kind: build
        run: |
          go build -v ./...
      - uses: cloudbees-io/configure-oci-credentials@v1
        name: Set up Docker Hub registry
        kind: deploy
        with:
          registry: index.docker.io
          username: ${{ vars.DOCKERHUB_UNAME }}
          password: ${{ secrets.DOCKERHUB_PWD }}
      - uses: cloudbees-io/kaniko/.cloudbees/testing
        name: Push image to OCI registry
        with:
          destination: index.docker.io/${{ vars.DOCKERHUB_UNAME }}/my-sample-go-app:1.0.0
          labels: app=cbp,run=3
  approve-deployment:
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1
    needs: build
    with:
      approvers: 0a808e26-f884-11ec-aa0a-42010a83ae55
      disallowLaunchByUser: false
      instructions: Good to deploy?
  deploy:
    needs:
      - approve-deployment
    steps:
      - uses: docker://golang:1.20.3-alpine3.17
        name: Say hello
        shell: sh
        run: |
          >&2 echo "WARNING: Warning line"
  