apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Failing step

on:
  push:
    branches:
      - "test_other"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Failing Step
        id: failing_step
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            throw new Error('This step is intentionally failing')

      - name: Verify Failure
        uses: docker://golang:1.20.3-alpine3.17
        if: steps.failing_step.outcome == 'failure'
        run: echo "The previous step failed as expected"
