name: Go Workflow with Failing Step

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Failing Step
        id: failing_step
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            throw new Error('This step is intentionally failing')

      - name: Verify Failure
        uses: docker://golang:1.20.3-alpine3.17
        if: steps.failing_step.outcome == 'failure'
        run: echo "The previous step failed as expected"
