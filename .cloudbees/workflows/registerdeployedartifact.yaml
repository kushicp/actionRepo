apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: publishAndDeployArtifact
on:
  workflow_dispatch:
    inputs:
      env:
        type: string
        default: Test_env
        required: true
jobs:
  deployArtifact:
    environment: ${{ inputs.env }}
    steps:
      - name: Register deployed artifact
        id: deployArtifact
        uses: cloudbees-io/register-deployed-artifact@main
        with:
          name: testArtifactRegister
          version: 1.1.0
          url: docker.io/MyKcpApp/testArtifactRegister:1.1.0
