          digest: sha256:5e0687d9471728b0a200e0a3840fa16466150c58f628dc6e6c40a9b07e313210
    needs:
      - sample
  sample:
    steps:
      - with:
          component-id: ca3d3c0e-c91d-40a0-8040-fc567b1be518
          url: https://example.com
          version: "1.0"
