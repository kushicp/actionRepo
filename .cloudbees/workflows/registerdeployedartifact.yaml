apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Failing step

on:
  push:
    branches:
      - "test_other"
  workflow_dispatch:
jobs:
  test:
    steps:

      - name: Failing Step
        id: failing_step
        continue-on-error: true
        uses: cloudbees-io/register-deployed-artifact@v1
        with:
          name: "testDeploymentRegister"
          version: "2.0.0"
          url: "docker.io/myapp/mytestimg:2.0.0"
          digest: "sha256:5e0687d9471728b0a200e0a3840fa16466150c58f628dc6e6c40a9b07e3b3622"

      - name: Verify Failure
        uses: docker://golang:1.20.3-alpine3.17
        if: steps.failing_step.outcome == 'failure'
        run: echo "The previous step failed as expected"
