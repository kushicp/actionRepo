apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: publishAndDeployArtifact
on:
  workflow_dispatch:
    inputs:
      env:
        type: string
        default: Test_env
        required: true
jobs:
  deployArtifact:
    environment: Test_env
    steps:
      - name: Register deployed artifact
        id: deployArtifact
        uses: cloudbees-io/register-deployed-artifact@main
        with:
          name: testDeploymentRegister3
          version: 3.0.0
          url: docker.io/MyKcpApp/testDeploymentRegister3:3.0.0
          digest: sha256:5e0687d9471728b0a200e0a3840fa16466150c58f628dc6e6c40a9b07e3b3633
