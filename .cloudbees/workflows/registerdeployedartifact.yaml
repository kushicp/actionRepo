apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: publishAndDeployArtifact
on:
  workflow_dispatch:
    inputs:
      environment:
        type: string
        required: true
        default: "kcp-env"
jobs:
  publishArtifact:
    steps:
      - name: Register published artifact
        id: publish
        uses: cloudbees-io/register-published-artifact@v1
        with:
          name: "testArtifactRegister"
          version: "1.1.0"
          url: "docker.io/MyKcpApp/testArtifactRegister:1.1.0"
          digest: "sha256:5e0687d9471728b0a200e0a3840fa16466150c58f628dc6e6c40a9b07e3b3644"
      - name: Artifact Details
        id: artifactDetails
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: |
            echo "Artifact details:" 
            echo "name: ${{ steps.publish.inputs.name }}"
            echo "name: ${{ steps.publish.inputs.version }}"

 