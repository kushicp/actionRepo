apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: LabelArtifactVersion
on:
  workflow_dispatch:
jobs:
  add_labels_to_artifact_ver:
    steps:
      - name: success_add_labels_to_artifact_ver
        uses: cloudbees-io/label-artifact-version@v1
        with:
          artifact-id: ea07033d-3008-40ec-9e50-a0efce7493d8
          labels: "hello, welcome,   dfa,#$%^,[]label,tra    ,(){}[]braces, g/h"
          operation: ADD
  remove_labels_from_artifact_ver:
    steps:
      - name: success_add_labels_to_artifact_ver
        with:
          artifact-id: ea07033d-3008-40ec-9e50-a0efce7493d8
          labels: "   dfa,#$%^,[]label,tra    ,(){}[]braces"
          operation: REMOVE
        uses: cloudbees-io/label-artifact-version@v1
    needs:
      - add_labels_to_artifact_ver
